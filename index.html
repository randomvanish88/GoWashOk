
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
      <meta name="theme-color" content="#0a0f1d" />
      <meta name="description" content="Sistema completo de gestión para lavadero artesanal GoWash Del Viso" />
      <link rel="manifest" href="/manifest.json" />
      <link rel="apple-touch-icon" href="/logo.png" />
      <title>GoWash Lavadero Artesanal</title>
      <link rel="icon" type="image/png" href="./logo.png" />
      <style>html, body { height: 100%; margin: 0; background-color: #0a0f1d; } #root { height: 100%; }</style>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
      <!-- Service Worker Registration -->
      <script>
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then((registration) => {
                console.log('✅ Service Worker registrado:', registration.scope);
                
                // Actualizar service worker cuando hay una nueva versión
                registration.addEventListener('updatefound', () => {
                  const newWorker = registration.installing;
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('🔄 Nueva versión disponible! Recarga la página.');
                      // Podrías mostrar un toast aquí
                    }
                  });
                });
              })
              .catch((error) => {
                console.error('❌ Error al registrar Service Worker:', error);
              });
          });
        }
      </script>
    </body>
  </html>
